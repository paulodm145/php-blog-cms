<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # A aplicação espera rodar com o document root em public/, resolvendo
    # o restante do projeto (app/, database/, .env) via dirname(__DIR__).
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloqueia acesso direto a qualquer coisa fora de public/, caso alguém
    # aponte para um path absoluto por engano.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
