<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>paulorb.dev — layout</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="blog-theme.css" rel="stylesheet"/>
<style>html,body{margin:0;padding:0;height:100%;background:#f0eee9}.min-w-0{min-width:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="blog-parts.jsx"></script>
<script type="text/babel" src="variation-b.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "fontFamily": "Inter",
  "sidebarSide": "direita"
}/*EDITMODE-END*/;

const FONTS = {
  "Inter": "'Inter', ui-sans-serif, system-ui, sans-serif",
  "Source Serif": "'Source Serif 4', ui-serif, Georgia, serif",
  "System": "ui-sans-serif, system-ui, -apple-system, sans-serif",
  "JetBrains Mono": "'JetBrains Mono', ui-monospace, monospace"
};

// Cada tela é renderizada nas duas skins; alturas medidas por modo.
const SCREENS = [
  { id: "home", label: "Home", Page: BHomePage, h: { light: 2170, dark: 2170 } },
  { id: "post", label: "Post", Page: BPostPage, h: { light: 2590, dark: 2590 } },
  { id: "cat", label: "Categorias", Page: BCategoriesPage, h: { light: 1235, dark: 1235 } },
  { id: "sobre", label: "Sobre", Page: BAboutPage, h: { light: 1465, dark: 1465 } }
];
const W = 1240;

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--prose-font', FONTS[t.fontFamily] || FONTS.Inter);
  }, [t.fontFamily]);
  React.useEffect(() => {
    const id = 'sidebar-side';
    const el = document.getElementById(id) || (() => { const s = document.createElement('style'); s.id = id; document.head.appendChild(s); return s; })();
    el.textContent = t.sidebarSide === 'esquerda' ? '.blog .row.g-5{flex-direction:row-reverse}' : '';
  }, [t.sidebarSide]);

  const boards = mode => SCREENS.map(({ id, label, Page, h }) => (
    <DCArtboard key={id} id={`${mode}-${id}`} label={label} width={W} height={h[mode]}>
      <Page dark={mode === 'dark'}/>
    </DCArtboard>
  ));

  return (
    <>
      <DesignCanvas>
        <DCSection id="light" title="Modo claro" subtitle="Azul #1d5fd0 sobre branco · neutros cinza-azulados">
          {boards('light')}
        </DCSection>
        <DCSection id="dark" title="Modo escuro" subtitle="Fundo #0e1116 · azul claro #6da4f5 · superfícies elevadas em #151a21">
          {boards('dark')}
        </DCSection>
      </DesignCanvas>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Tipografia"/>
        <TweakSelect label="Fonte" value={t.fontFamily} options={Object.keys(FONTS)} onChange={v => setTweak('fontFamily', v)}/>
        <TweakSection label="Layout"/>
        <TweakRadio label="Sidebar" value={t.sidebarSide} options={["esquerda","direita"]} onChange={v => setTweak('sidebarSide', v)}/>
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
